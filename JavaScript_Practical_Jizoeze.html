<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programming Practical Questions</title>
<style>
  :root{
    --bg:#0e1219; --panel:#161c27; --panel-alt:#1c2432; --border:#2a3242;
    --text:#e8ecf1; --text-dim:#8b95a7; --text-faint:#5a6478;
    --accent:#f2b134; --accent-dim:#8a6a2a;
    --mono: ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace;
    --sans: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, #182033 0%, transparent 45%),
      radial-gradient(circle at 85% 100%, #1a2440 0%, transparent 45%),
      var(--bg);
    color:var(--text); font-family:var(--sans); min-height:100vh;
    padding:32px 16px 64px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;}
  .term{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    overflow:hidden;box-shadow:0 20px 60px -20px rgba(0,0,0,0.6);}
  .term-bar{display:flex;align-items:center;gap:16px;padding:10px 16px;
    background:var(--panel-alt);border-bottom:1px solid var(--border);}
  .dots{display:flex;gap:7px;} .dot{width:11px;height:11px;border-radius:50%;}
  .dot.r{background:#e2574c;} .dot.y{background:#f2b134;} .dot.g{background:#4fb379;}
  .term-title{font-family:var(--mono);font-size:12.5px;color:var(--text-dim);flex:1;text-align:center;margin-right:44px;}
  .term-body{padding:60px 28px 64px;text-align:center;}
  @media (max-width:600px){ .term-body{padding:44px 16px 48px;} body{padding:18px 8px 48px;} }

  .caret{display:inline-block;animation:blink 1.1s steps(1) infinite;color:var(--accent);}
  @keyframes blink{50%{opacity:0;}}

  .badge{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.5px;margin-bottom:18px;}
  h1{font-size:26px;margin:0 0 14px;}
  p.sub{color:var(--text-dim);font-size:15px;line-height:1.6;max-width:480px;margin:0 auto 28px;}
  .btn{font-family:var(--sans);font-weight:600;font-size:14px;padding:11px 20px;border-radius:7px;
    border:1px solid var(--accent);background:var(--accent);color:#1a1406;cursor:pointer;
    text-decoration:none;display:inline-block;transition:background .15s ease;}
  .btn:hover{background:#ffc659;}

  .footer-note{text-align:center;color:var(--text-faint);font-size:12px;margin-top:18px;font-family:var(--mono);}
</style>
</head>
<body>
<div class="wrap">
  <div class="term">
    <div class="term-bar">
      <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
      <div class="term-title">programming-practical.qn</div>
    </div>
    <div class="term-body">
      <div class="badge">&gt;_ status<span class="caret">|</span></div>
      <h1>Inakuja Hivi Karibuni</h1>
      <p class="sub">Sehemu ya Practical JavaScript inatengenezwa. Rudi baadaye kuendelea kujizoeza maswali ya coding kwa ajili ya usaili wa ICT Officer (Programmer).</p>
      <a class="btn" href="JavaScript_Interview_Quiz.html">&larr; Rudi kwenye Interview Quiz</a>
    </div>
  </div>
  <div class="footer-note">Coming soon</div>
</div>
</body>
</html>
