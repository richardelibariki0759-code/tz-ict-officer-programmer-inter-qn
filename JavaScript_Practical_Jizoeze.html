<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practical JavaScript — Jizoeze (Practice)</title>
<style>
  :root{
    --bg:#0e1219; --panel:#161c27; --panel-alt:#1c2432; --border:#2a3242;
    --text:#e8ecf1; --text-dim:#8b95a7; --text-faint:#5a6478;
    --accent:#f2b134; --accent-dim:#8a6a2a;
    --correct:#4fb379; --correct-bg:#173124;
    --incorrect:#e2574c; --incorrect-bg:#301a1a;
    --mono: ui-monospace,'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace;
    --sans: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, #182033 0%, transparent 45%),
      radial-gradient(circle at 85% 100%, #1a2440 0%, transparent 45%),
      var(--bg);
    color:var(--text); font-family:var(--sans); min-height:100vh;
    padding:32px 16px 64px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;}
  .term{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    overflow:hidden;box-shadow:0 20px 60px -20px rgba(0,0,0,0.6);}
  .term-bar{display:flex;align-items:center;gap:16px;padding:10px 16px;
    background:var(--panel-alt);border-bottom:1px solid var(--border);}
  .dots{display:flex;gap:7px;} .dot{width:11px;height:11px;border-radius:50%;}
  .dot.r{background:#e2574c;} .dot.y{background:#f2b134;} .dot.g{background:#4fb379;}
  .term-title{font-family:var(--mono);font-size:12.5px;color:var(--text-dim);flex:1;text-align:center;margin-right:44px;}
  .term-body{padding:28px 28px 32px;}
  @media (max-width:600px){ .term-body{padding:20px 16px 26px;} body{padding:18px 8px 48px;} }

  .progress-row{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
  .progress-label{font-family:var(--mono);font-size:12px;color:var(--accent);white-space:nowrap;}
  .progress-track{flex:1;height:6px;background:var(--panel-alt);border-radius:4px;overflow:hidden;border:1px solid var(--border);}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent-dim),var(--accent));width:0%;transition:width .4s ease;}
  .score-label{font-family:var(--mono);font-size:12px;color:var(--text-dim);white-space:nowrap;}

  .qnum{font-family:var(--mono);font-size:13px;color:var(--accent);margin-bottom:6px;display:flex;align-items:center;gap:8px;}
  .qnum .caret{display:inline-block;animation:blink 1.1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  .qprompt{font-size:15px;color:var(--text-dim);margin:0 0 14px;}

  pre.code{font-family:var(--mono);font-size:13.5px;line-height:1.65;background:#0b0e14;
    border:1px solid var(--border);border-left:3px solid var(--accent-dim);border-radius:6px;
    padding:14px 16px;overflow-x:auto;margin:0 0 18px;color:#cdd6e4;white-space:pre;}
  .tok-kw{color:#7aa2f7;} .tok-str{color:#9ece6a;} .tok-num{color:#e0af68;}
  .tok-com{color:#5a6478;} .tok-fn{color:#f2b134;}

  .answer-row{display:flex;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
  .ans-input{flex:1;min-width:180px;font-family:var(--mono);font-size:14.5px;
    background:#0b0e14;color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:12px 14px;outline:none;transition:border-color .15s;}
  .ans-input:focus{border-color:var(--accent-dim);}
  .ans-input:disabled{opacity:.7;}
  .ans-input.ok{border-color:var(--correct);}
  .ans-input.bad{border-color:var(--incorrect);}
  .ans-hint{font-family:var(--mono);font-size:11.5px;color:var(--text-faint);margin:2px 0 14px;}

  .btn{font-family:var(--sans);font-weight:600;font-size:14px;padding:11px 18px;border-radius:7px;
    border:1px solid var(--border);background:var(--panel-alt);color:var(--text);cursor:pointer;
    transition:background .15s ease,border-color .15s;white-space:nowrap;}
  .btn:hover:not(:disabled){background:#212b3c;}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn.primary{background:var(--accent);color:#1a1406;border-color:var(--accent);}
  .btn.primary:hover:not(:disabled){background:#ffc659;}
  .btn.ghost{background:transparent;}

  .explain{max-height:0;overflow:hidden;transition:max-height .35s ease;}
  .explain.open{max-height:1000px;margin-top:16px;}
  .explain-inner{background:#0b0e14;border:1px solid var(--border);border-radius:8px;padding:16px 18px;}
  .verdict{font-family:var(--mono);font-weight:700;font-size:13.5px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .verdict.ok{color:var(--correct);} .verdict.bad{color:var(--incorrect);}
  .ans-reveal{display:flex;align-items:stretch;border:1px solid var(--correct);border-radius:7px;overflow:hidden;margin-bottom:12px;}
  .ans-reveal .lbl{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.5px;
    color:#04120b;background:var(--correct);padding:8px 12px;display:flex;align-items:center;}
  .ans-reveal pre{flex:1;margin:0;font-family:var(--mono);font-size:14px;line-height:1.5;
    background:var(--correct-bg);color:#8ff0bd;padding:8px 14px;white-space:pre;overflow-x:auto;}
  .explain-head{font-family:var(--mono);font-size:12px;color:var(--text-faint);margin-bottom:8px;}
  .explain p{margin:0 0 8px;font-size:14px;line-height:1.6;color:#c6cede;}
  .explain p:last-child{margin-bottom:0;}
  .explain code{font-family:var(--mono);background:#171d29;padding:1px 5px;border-radius:4px;font-size:13px;color:#e0af68;}

  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:10px;}

  .results-head{font-family:var(--mono);color:var(--accent);font-size:13px;margin-bottom:4px;}
  .results-title{font-size:22px;font-weight:700;margin:0 0 4px;}
  .results-sub{color:var(--text-dim);font-size:14px;margin:0 0 22px;}
  .score-big{font-family:var(--mono);font-size:44px;font-weight:700;color:var(--accent);line-height:1;}
  .score-pct{font-family:var(--mono);color:var(--text-dim);font-size:14px;margin-top:4px;}
  .runner{background:#0b0e14;border:1px solid var(--border);border-radius:8px;padding:14px 16px;
    margin:22px 0;font-family:var(--mono);font-size:13px;max-height:340px;overflow-y:auto;}
  .runner-line{display:flex;gap:10px;padding:3px 0;color:var(--text-dim);align-items:center;}
  .runner-line .rmark{width:14px;flex-shrink:0;}
  .runner-line.pass .rmark{color:var(--correct);} .runner-line.fail .rmark{color:var(--incorrect);}
  .runner-line.fail{color:#d9b9b6;}
  .runner-line .rlabel{color:var(--text-faint);margin-left:auto;flex-shrink:0;}

  .footer-note{text-align:center;color:var(--text-faint);font-size:12px;margin-top:18px;font-family:var(--mono);}
</style>
</head>
<body>
<div class="wrap">
  <div class="term">
    <div class="term-bar">
      <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
      <div class="term-title" id="termTitle">practical-javascript.jizoeze</div>
    </div>
    <div class="term-body" id="termBody"></div>
  </div>
  <div class="footer-note">Andika output ➜ bonyeza Angalia ➜ soma maelezo ➜ endelea</div>
  <div class="footer-note"><a href="JavaScript_Interview_Quiz.html" style="color:var(--accent);text-decoration:none;">&larr; Rudi kwenye Interview Quiz (chagua kiwango)</a></div>
</div>

<script>
const QUESTIONS = [{"code": "function add(a, b){\n  return a + b;\n}\n\nconsole.log(add(10, 20));", "answer": "30", "explain": ["a = 10, b = 20. <code>return a + b</code> = 10 + 20 = <b>30</b>."]}, {"code": "let arr = [5, 10, 15];\n\nconsole.log(arr[2]);", "answer": "15", "explain": ["Array huanza index <b>0</b>: arr[0]=5, arr[1]=10, arr[2]=15."]}, {"code": "let name = \"John\";\n\nconsole.log(name.length);", "answer": "4", "explain": ["\"John\" ina herufi 4 (J-o-h-n). <code>name.length</code> = <b>4</b>."]}, {"code": "let x = 7;\n\nif(x % 2 === 0){\n  console.log(\"Even\");\n}else{\n  console.log(\"Odd\");\n}", "answer": "Odd", "explain": ["7 % 2 = 1 (si 0), hivyo condition ni <b>false</b> &rarr; <code>else</code>: <b>Odd</b>."]}, {"code": "function multiply(a, b){\n  return a * b;\n}\n\nconsole.log(multiply(4, 5));", "answer": "20", "explain": ["multiply(4, 5) &rarr; 4 &times; 5 = <b>20</b>."]}, {"code": "let arr = [10, 20, 30];\n\narr.push(40);\n\nconsole.log(arr.length);", "answer": "4", "explain": ["<code>push(40)</code> &rarr; arr inakuwa [10, 20, 30, 40]. <code>arr.length</code> = idadi ya elements = <b>4</b>."]}, {"code": "let person = {\n  name: \"John\",\n  age: 25\n};\n\nconsole.log(person.age);", "answer": "25", "explain": ["<code>person.age</code> huchukua thamani ya <b>age</b> = <b>25</b>."]}, {"code": "let x = \"Hello\";\n\nconsole.log(x.toUpperCase());", "answer": "HELLO", "explain": ["<code>toUpperCase()</code> hubadilisha herufi zote kuwa kubwa: <b>HELLO</b>."]}, {"code": "let x = \"JAVASCRIPT\";\n\nconsole.log(x.toLowerCase());", "answer": "javascript", "explain": ["<code>toLowerCase()</code> hubadilisha herufi zote kuwa ndogo: <b>javascript</b>."]}, {"code": "let arr = [2, 4, 6];\n\nconsole.log(arr[0] + arr[2]);", "answer": "8", "explain": ["arr[0]=2, arr[2]=6. 2 + 6 = <b>8</b>."]}, {"code": "for(let i = 1; i <= 3; i++){\n  console.log(i);\n}", "answer": "1\n2\n3", "explain": ["Loop i = 1 hadi 3 hu-print kila i kwenye mstari wake: <b>1, 2, 3</b>."]}, {"code": "let x = 10;\n\nconsole.log(x > 5);", "answer": "true", "explain": ["10 &gt; 5 ni kweli &rarr; <b>true</b>."]}, {"code": "let x = 10;\n\nconsole.log(x < 5);", "answer": "false", "explain": ["10 &lt; 5 si kweli &rarr; <b>false</b>."]}, {"code": "let x = 5;\nlet y = 10;\n\nconsole.log(x + y);", "answer": "15", "explain": ["5 + 10 = <b>15</b>."]}, {"code": "let x = 5;\nlet y = 10;\n\nconsole.log(y - x);", "answer": "5", "explain": ["10 - 5 = <b>5</b>."]}, {"code": "let x = 5;\n\nconsole.log(x * 2);", "answer": "10", "explain": ["5 * 2 = <b>10</b>."]}, {"code": "let x = 20;\n\nconsole.log(x / 4);", "answer": "5", "explain": ["20 / 4 = <b>5</b>."]}, {"code": "let x = 3;\n\nx++;\n\nconsole.log(x);", "answer": "4", "explain": ["<code>x++</code> huongeza 1: 3 + 1 = <b>4</b>."]}, {"code": "let x = 10;\n\nx--;\n\nconsole.log(x);", "answer": "9", "explain": ["<code>x--</code> hupunguza 1: 10 - 1 = <b>9</b>."]}, {"code": "let x = 5;\n\nconsole.log(x == \"5\");", "answer": "true", "explain": ["<code>==</code> huangalia <b>value tu</b> (si type). 5 == \"5\" &rarr; <b>true</b>."]}, {"code": "let x = 5;\n\nconsole.log(x === \"5\");", "answer": "false", "explain": ["<code>===</code> huangalia value <b>NA</b> type. 5 (Number) vs \"5\" (String) &rarr; <b>false</b>."]}, {"code": "let x = \"10\";\n\nconsole.log(Number(x));", "answer": "10", "explain": ["<code>Number(x)</code> hubadilisha string \"10\" kuwa number <b>10</b>."]}, {"code": "let word = \"JavaScript\";\n\nconsole.log(word.length);", "answer": "10", "explain": ["\"JavaScript\" ina herufi <b>10</b>."]}, {"code": "let arr = [100, 200, 300];\n\nconsole.log(arr[0]);", "answer": "100", "explain": ["<code>arr[0]</code> = element ya kwanza = <b>100</b>."]}, {"code": "let arr = [100, 200, 300];\n\nconsole.log(arr[2]);", "answer": "300", "explain": ["<code>arr[2]</code> = element ya tatu = <b>300</b>."]}, {"code": "let arr = [1, 2, 3];\n\narr.push(4);\n\nconsole.log(arr.length);", "answer": "4", "explain": ["<code>push(4)</code> &rarr; [1, 2, 3, 4]. <code>arr.length</code> = <b>4</b>."]}, {"code": "let person = {\n  name: \"Ali\"\n};\n\nconsole.log(person.name);", "answer": "Ali", "explain": ["<code>person.name</code> = <b>Ali</b>. (JavaScript ni case-sensitive: \"Ali\" &ne; \"ali\")."]}, {"code": "let numbers = [10, 20, 30];\n\nconsole.log(numbers.length);", "answer": "3", "explain": ["<code>numbers.length</code> = idadi ya elements = <b>3</b>."]}, {"code": "let x = \"Hello\";\n\nconsole.log(x[1]);", "answer": "e", "explain": ["String index huanza <b>0</b>: x[0]=\"H\", x[1]=\"e\". Kwa hiyo x[1] = <b>e</b>."]}, {"code": "let x = \"Hello\";\n\nconsole.log(x[4]);", "answer": "o", "explain": ["x = \"Hello\": index 0=H, 1=e, 2=l, 3=l, 4=o. Kwa hiyo x[4] = <b>o</b>."]}];

function pad2(n){ n=""+n; return n.length<2 ? "0"+n : n; }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function highlightCode(str){
  let s = esc(str);
  s = s.replace(/(\/\/.*$)/gm, '§COM§$1§/COM§');
  s = s.replace(/"([^"]*)"/g, '§STR§"$1"§/STR§');
  s = s.replace(/\b(let|const|function|return|if|else|for|typeof|console|Number)\b/g, '§KW§$1§/KW§');
  s = s.replace(/\.(log|push|pop|length|toUpperCase|toLowerCase)\b/g, '.§FN§$1§/FN§');
  s = s.replace(/\b(\d+)\b/g, '§NUM§$1§/NUM§');
  s = s.replace(/§COM§/g,'<span class="tok-com">').replace(/§\/COM§/g,'</span>');
  s = s.replace(/§STR§/g,'<span class="tok-str">').replace(/§\/STR§/g,'</span>');
  s = s.replace(/§KW§/g,'<span class="tok-kw">').replace(/§\/KW§/g,'</span>');
  s = s.replace(/§FN§/g,'<span class="tok-fn">').replace(/§\/FN§/g,'</span>');
  s = s.replace(/§NUM§/g,'<span class="tok-num">').replace(/§\/NUM§/g,'</span>');
  return s;
}

function norm(s){
  return String(s).trim().replace(/^["'`]+|["'`]+$/g,'').replace(/[\s,]+/g,'').toLowerCase();
}
function isCorrect(q, val){ return norm(val) === norm(q.answer); }

let current = 0;
// state[i] = {given: string, correct: bool, revealed: bool} | null
let state = new Array(QUESTIONS.length).fill(null);
const body = document.getElementById('termBody');
const termTitle = document.getElementById('termTitle');

function render(){
  const q = QUESTIONS[current];
  const st = state[current];
  const total = QUESTIONS.length;
  const answeredCount = state.filter(s=>s!==null).length;
  const scoreSoFar = state.reduce((a,s)=> a + (s && s.correct ? 1 : 0), 0);
  const done = st!==null;

  termTitle.textContent = `practical-javascript.jizoeze — swali ${current+1}/${total}`;

  let html = '';
  html += `<div class="progress-row">
      <span class="progress-label">PRACTICAL ${pad2(current+1)}/${total}</span>
      <div class="progress-track"><div class="progress-fill" style="width:${(current)/total*100}%"></div></div>
      <span class="score-label">alama: ${scoreSoFar}/${answeredCount}</span>
    </div>`;

  html += `<div class="qnum"><span class="caret">&gt;_</span> Swali la Practical ${current+1}</div>`;
  html += `<p class="qprompt">Andika output ya code hii:</p>`;
  html += `<pre class="code">${highlightCode(q.code)}</pre>`;

  const inCls = done ? (st.correct ? 'ok' : 'bad') : '';
  const inVal = done ? esc(st.given) : '';
  html += `<div class="answer-row">
      <input id="ansInput" class="ans-input ${inCls}" type="text" autocomplete="off" spellcheck="false"
        placeholder="andika output hapa..." value="${inVal}" ${done?'disabled':''}>
      ${done ? '' : `<button class="btn primary" onclick="checkAns()">Angalia jibu</button>`}
    </div>`;
  if(!done){
    html += `<div class="ans-hint">// bonyeza Enter au Angalia jibu &nbsp;•&nbsp; husikii herufi kubwa/ndogo</div>`;
  }

  html += `<div class="explain ${done?'open':''}">`;
  if(done){
    const ok = st.correct;
    let vtxt;
    if(st.revealed) vtxt = 'ℹ Jibu sahihi lilionyeshwa';
    else vtxt = ok ? '✓ Sahihi!' : '✕ Si sahihi';
    html += `<div class="explain-inner">
        <div class="verdict ${ok?'ok':'bad'}">${vtxt}</div>
        <div class="ans-reveal"><span class="lbl">JIBU SAHIHI</span><pre>${esc(q.answer)}</pre></div>
        <div class="explain-head">// Maelezo</div>
        ${q.explain.map(l=>`<p>${l}</p>`).join('')}
      </div>`;
  }
  html += `</div>`;

  html += `<div class="nav-row">
      <button class="btn ghost" onclick="prevQ()" ${current===0?'disabled':''}>&larr; Nyuma</button>
      <div style="display:flex;gap:10px;">
        ${done ? '' : `<button class="btn ghost" onclick="reveal()">Sijui — nionyeshe</button>`}
        ${current===total-1
          ? `<button class="btn primary" onclick="showResults()" ${done?'':'disabled'}>Ona Matokeo &rarr;</button>`
          : `<button class="btn primary" onclick="nextQ()" ${done?'':'disabled'}>Endelea &rarr;</button>`}
      </div>
    </div>`;

  body.innerHTML = html;

  const inp = document.getElementById('ansInput');
  if(inp && !done){
    inp.focus();
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); checkAns(); }});
  }
}

function checkAns(){
  if(state[current]!==null) return;
  const inp = document.getElementById('ansInput');
  const val = inp ? inp.value : '';
  if(val.trim()===''){ inp && inp.focus(); return; }
  state[current] = { given: val, correct: isCorrect(QUESTIONS[current], val), revealed:false };
  render();
}
function reveal(){
  if(state[current]!==null) return;
  const inp = document.getElementById('ansInput');
  state[current] = { given: inp ? inp.value : '', correct:false, revealed:true };
  render();
}
function nextQ(){ if(current<QUESTIONS.length-1){ current++; render(); } }
function prevQ(){ if(current>0){ current--; render(); } }

function showResults(){
  const total = QUESTIONS.length;
  const score = state.reduce((a,s)=> a + (s && s.correct ? 1 : 0), 0);
  const pct = Math.round(score/total*100);
  termTitle.textContent = `practical-javascript.jizoeze — matokeo`;

  const runnerLines = QUESTIONS.map((q,i)=>{
    const s = state[i];
    const ok = s && s.correct;
    let label;
    if(!s) label = 'hujajibu';
    else if(ok) label = 'PASS';
    else if(s.revealed) label = 'ulionyeshwa → '+q.answer;
    else label = 'jibu: '+ (s.given||'—') +' → sahihi: '+q.answer;
    return `<div class="runner-line ${ok?'pass':'fail'}">
        <span class="rmark">${ok?'✓':'✕'}</span>
        <span>Practical ${i+1}</span>
        <span class="rlabel">${esc(label)}</span>
      </div>`;
  }).join('');

  let msg;
  if(pct>=90) msg = "Umeshamiliki Practical za msingi za JavaScript. 🚀";
  else if(pct>=70) msg = "Kiwango kizuri — rudia maeneo uliyokosea kisha uko tayari. 👏";
  else if(pct>=50) msg = "Msingi upo, lakini jizoeze tena maeneo uliyokosea.";
  else msg = "Rudia mada za msingi (arrays, ==/===, typeof, string index) kisha jaribu tena.";

  body.innerHTML = `
    <div class="results-head">&gt;_ npm test --suite=practical-javascript</div>
    <h2 class="results-title">Matokeo Yako</h2>
    <p class="results-sub">${msg}</p>
    <div class="score-big">${score}/${total}</div>
    <div class="score-pct">sahihi: ${pct}%</div>
    <div class="runner">${runnerLines}</div>
    <div class="nav-row">
      <button class="btn ghost" onclick="current=0;render();">&larr; Pitia Maswali</button>
      <button class="btn primary" onclick="restart()">Anza Upya &rarr;</button>
    </div>`;
}

function restart(){ state = new Array(QUESTIONS.length).fill(null); current = 0; render(); }

render();
</script>
</body>
</html>
